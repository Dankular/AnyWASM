[package]
name = "anywasm-cpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "x86-64 user-mode CPU core (decoder + interpreter) with paged, permission-checked guest memory"

[features]
default = ["std"]
std = []
jit-test-api = ["std"]

[dependencies]
anywasm-cpu-state = { workspace = true, features = ["std"] }

[dev-dependencies]
libc = "0.2"
